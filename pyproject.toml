[project]
name = "telerocket"
version = "0.1.0"
description = "Personal bridge between a Rocket.Chat account and Telegram"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot>=21.6,<23",
    "httpx>=0.27",
    "websockets>=13.0",
]

[project.scripts]
telerocket = "telerocket.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
